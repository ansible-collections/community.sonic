---
- name: Set port properties
  community.sonic.interface_port:
    interface: Ethernet0
    description: This is the uplink!
    speed: 1G
    enabled: true
  register: result1

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - result1 is changed
      - "'Ethernet' in result1.interface"

- name: Query the system for the interface description
  ansible.builtin.command: "show interfaces description {{ result1.interface }}"
  changed_when: false
  register: check1
  retries: 10
  delay: 1
  until: "'This is the uplink' in check1.stdout"

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ check1.stdout }}'

- name: Check that the description has changed
  ansible.builtin.assert:
    that:
      - "'This is the uplink' in check1.stdout"

- name: Remove port description
  community.sonic.interface_port:
    interface: Ethernet0
  diff: true
  register: result2

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - result2 is changed
      - "'Ethernet' in result2.interface"

- name: Query the system for the interface description
  ansible.builtin.command: "show interfaces description {{ result2.interface }}"
  changed_when: false
  retries: 10
  delay: 1
  until: "'This is the uplink' not in check2.stdout"
  register: check2

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ check2.stdout }}'

- name: Check that the description is gone
  ansible.builtin.assert:
    that:
      - "'This is the uplink' not in check2.stdout"
      - "'N/A' not in check2.stdout"

- name: Query the system for the interface status
  community.sonic.get_entry:
    table: PORT
    key: "{{ result1.interface }}"
  register: check3

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ check3.value }}'

- name: Check that the speed and status is what we expect
  ansible.builtin.assert:
    that:
      - check3.value.speed == '1000'
      - check3.value.admin_status == 'up'

- name: Set port properties - 100G mode
  community.sonic.interface_port:
    interface: Ethernet0
    description: This is the uplink!
    speed: 100G
    enabled: true
    fec: rs
  diff: true
  register: result3

- name: Query the system for the interface status
  community.sonic.get_entry:
    table: PORT
    key: "{{ result3.interface }}"
  register: check4

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ check4.value }}'

- name: Check that the speed and status is what we expect
  ansible.builtin.assert:
    that:
      - check4.value.speed == '100000'
      - check4.value.admin_status == 'up'
      - check4.value.fec == 'rs'

- name: Set port properties - 40G mode
  community.sonic.interface_port:
    interface: Ethernet0
    description: This is the uplink!
    speed: 40G
    enabled: true
  diff: true
  register: result4

- name: Query the system for the interface status
  community.sonic.get_entry:
    table: PORT
    key: "{{ result4.interface }}"
  register: check5

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ check5.value }}'

- name: Check that the speed and status is what we expect
  ansible.builtin.assert:
    that:
      - check5.value.speed == '40000'
      - check5.value.admin_status == 'up'
      - check5.value.fec == 'none'


- name: Predict disabling the interface
  community.sonic.interface_port:
    interface: Ethernet0
    enabled: false
  check_mode: true
  diff: true
  register: disable_prediction

- name: Read interface after check mode
  community.sonic.get_entry:
    table: PORT
    key: Ethernet0
  register: after_check_mode

- name: Verify check mode did not write
  ansible.builtin.assert:
    that:
      - disable_prediction is changed
      - after_check_mode.value.admin_status == 'up'
      - disable_prediction.diff.after.admin_status == 'down'

- name: Disable the interface
  community.sonic.interface_port:
    interface: Ethernet0
    enabled: false
  register: disabled

- name: Disable the interface again
  community.sonic.interface_port:
    interface: Ethernet0
    enabled: false
  register: disabled_again

- name: Read interface after disabling
  community.sonic.get_entry:
    table: PORT
    key: Ethernet0
  register: after_disable

- name: Check disabling is idempotent
  ansible.builtin.assert:
    that:
      - disabled is changed
      - disabled_again is not changed
      - after_disable.value.admin_status == 'down'

- name: Call the module through its deprecated sonic_interface_port name
  community.sonic.sonic_interface_port:
    interface: Ethernet0
    description: Set through the deprecated module name
  register: deprecated_name

- name: Read interface after using the deprecated name
  community.sonic.get_entry:
    table: PORT
    key: Ethernet0
  register: after_deprecated_name

- name: Check the deprecated name redirects to interface_port
  ansible.builtin.assert:
    that:
      - deprecated_name is changed
      - deprecated_name.interface == 'Ethernet0'
      - after_deprecated_name.value.description == 'Set through the deprecated module name'

- name: Clear the description set through the deprecated name
  community.sonic.interface_port:
    interface: Ethernet0
  register: cleared_after_deprecated_name

- name: Check the description is cleared again
  ansible.builtin.assert:
    that:
      - cleared_after_deprecated_name is changed

# Transceiver settings (laser frequency, TX power, DOM polling). The virtual
# switch has no optics, so the fields are only checked in CONFIG_DB on an
# otherwise unused port.
- name: Read the transceiver test port before the test
  community.sonic.get_entry:
    table: PORT
    key: Ethernet28
  register: transceiver_before

- name: Check the transceiver test port starts without transceiver settings
  ansible.builtin.assert:
    that:
      - "'laser_freq' not in transceiver_before.value"
      - "'tx_power' not in transceiver_before.value"
      - "'dom_polling' not in transceiver_before.value"

- name: Predict setting transceiver settings
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 194900
    tx_power: -10
    dom_polling: disabled
  check_mode: true
  diff: true
  register: transceiver_prediction

- name: Read the transceiver test port after check mode
  community.sonic.get_entry:
    table: PORT
    key: Ethernet28
  register: transceiver_after_check_mode

- name: Verify check mode predicted the change without writing
  ansible.builtin.assert:
    that:
      - transceiver_prediction is changed
      - transceiver_prediction.diff.after.laser_freq == '194900'
      - transceiver_prediction.diff.after.tx_power == '-10.0'
      - transceiver_prediction.diff.after.dom_polling == 'disabled'
      - transceiver_after_check_mode.value == transceiver_before.value

- name: Set transceiver settings
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 194900
    tx_power: -10
    dom_polling: disabled
  diff: true
  register: transceiver_set

- name: Set transceiver settings again
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 194900
    tx_power: -10
    dom_polling: disabled
  register: transceiver_set_again

- name: Read the transceiver test port after setting
  community.sonic.get_entry:
    table: PORT
    key: Ethernet28
  register: transceiver_after_set

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ transceiver_after_set.value }}'

- name: Check the transceiver settings are in CONFIG_DB and idempotent
  ansible.builtin.assert:
    that:
      - transceiver_set is changed
      - transceiver_set.interface == 'Ethernet28'
      - transceiver_set_again is not changed
      - transceiver_after_set.value.laser_freq == '194900'
      - transceiver_after_set.value.tx_power == '-10.0'
      - transceiver_after_set.value.dom_polling == 'disabled'
      - transceiver_after_set.value.speed == transceiver_before.value.speed

- name: Change one transceiver setting and leave the others alone
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 193100
  register: transceiver_change

- name: Read the transceiver test port after the change
  community.sonic.get_entry:
    table: PORT
    key: Ethernet28
  register: transceiver_after_change

- name: Check only the laser frequency changed
  ansible.builtin.assert:
    that:
      - transceiver_change is changed
      - transceiver_after_change.value.laser_freq == '193100'
      - transceiver_after_change.value.tx_power == '-10.0'
      - transceiver_after_change.value.dom_polling == 'disabled'

- name: Clear transceiver settings
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 0
    tx_power: 0
    dom_polling: default
  diff: true
  register: transceiver_clear

- name: Clear transceiver settings again
  community.sonic.interface_port:
    interface: Ethernet28
    laser_frequency: 0
    tx_power: 0
    dom_polling: default
  register: transceiver_clear_again

- name: Read the transceiver test port after clearing
  community.sonic.get_entry:
    table: PORT
    key: Ethernet28
  register: transceiver_after_clear

- name: Check the transceiver settings are gone and the port is as before
  ansible.builtin.assert:
    that:
      - transceiver_clear is changed
      - transceiver_clear_again is not changed
      - "'laser_freq' not in transceiver_after_clear.value"
      - "'tx_power' not in transceiver_after_clear.value"
      - "'dom_polling' not in transceiver_after_clear.value"
      - transceiver_after_clear.value == transceiver_before.value
