---
- name: Add VLAN
  community.sonic.vlan:
    vlanid: 3360
    dhcp_servers:
      - '127.0.0.1'
  register: add_vlan_result

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - add_vlan_result is changed
      - "'Vlan3360' in add_vlan_result.interface"

- name: Apply the same VLAN again
  community.sonic.vlan:
    vlanid: 3360
    dhcp_servers:
      - '127.0.0.1'
  register: unchanged_vlan_result

- name: Check VLAN creation is idempotent
  ansible.builtin.assert:
    that:
      - unchanged_vlan_result is not changed
      - unchanged_vlan_result.diff.before == unchanged_vlan_result.diff.after

- name: Query the system for vlans
  ansible.builtin.command: show vlan brief
  changed_when: false
  register: vlan_brief_result

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ vlan_brief_result.stdout }}'

- name: Check that the VLAN has been added
  ansible.builtin.assert:
    that:
      - vlan_brief_result.stdout is search('(?m)^.*\\b3360\\b.*127[.]0[.]0[.]1.*$')

- name: Add tagged VLAN member
  community.sonic.vlan_member:
    vlanid: 3360
    interface: Ethernet0
    tagged: true
  register: add_vlan_member_result

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - add_vlan_member_result is changed

- name: Query the system for vlans
  ansible.builtin.command: show vlan brief
  changed_when: false
  register: vlan_brief_result

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ vlan_brief_result.stdout }}'

- name: Check that the VLAN member has been added
  ansible.builtin.assert:
    that:
      - vlan_brief_result.stdout is search('(?m)^.*\\b3360\\b.*Ethernet0.*\\btagged\\b.*$')

- name: Change VLAN member to untagged
  community.sonic.vlan_member:
    vlanid: 3360
    interface: Ethernet0
    tagged: false
  register: mod_vlan_member_result

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - mod_vlan_member_result is changed

- name: Query the system for vlans
  ansible.builtin.command: show vlan brief
  changed_when: false
  register: vlan_brief_result

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ vlan_brief_result.stdout }}'

- name: Check that the VLAN member has been changed to untagged
  ansible.builtin.assert:
    that:
      - vlan_brief_result.stdout is search('(?m)^.*\\b3360\\b.*Ethernet0.*\\buntagged\\b.*$')

- name: Remove VLAN member
  community.sonic.vlan_member:
    vlanid: 3360
    interface: Ethernet0
    state: absent
  register: del_vlan_member_result

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - del_vlan_member_result is changed

- name: Query the system for vlans
  ansible.builtin.command: show vlan brief
  changed_when: false
  register: vlan_brief_result

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ vlan_brief_result.stdout }}'

- name: Check that the VLAN member has been removed
  ansible.builtin.assert:
    that:
      - vlan_brief_result.stdout is search('(?m)^.*\\b3360\\b.*127[.]0[.]0[.]1.*$')
      - vlan_brief_result.stdout is not search('(?m)^.*\\b3360\\b.*Ethernet0.*$')

- name: Remove VLAN
  community.sonic.vlan:
    vlanid: 3360
    state: absent
  register: remove_vlan_result

- name: Check the module returns what we expect
  ansible.builtin.assert:
    that:
      - remove_vlan_result is changed
      - "'Vlan3360' in remove_vlan_result.interface"

- name: Query the system for vlans
  ansible.builtin.command: show vlan brief
  changed_when: false
  register: vlan_brief_result

- name: Output from system command
  ansible.builtin.debug:
    msg: '{{ vlan_brief_result.stdout }}'

- name: Check that the VLAN has been removed
  ansible.builtin.assert:
    that:
      - vlan_brief_result.stdout is not search('(?m)^.*\\b3360\\b.*$')
