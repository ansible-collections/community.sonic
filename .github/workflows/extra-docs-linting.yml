---
name: Lint extra docsite docs and links
on:
  push:
    branches: [main, stable-*]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  docsite:
    name: Lint extra docsite docs and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install documentation tools
        run: python -m pip install ansible-core antsibull-docs antsibull-changelog --disable-pip-version-check
      - name: Run collection docs linter
        run: antsibull-docs lint-collection-docs .
      - name: Validate changelog fragments
        run: antsibull-changelog lint
      - name: Build collection artifact
        run: ansible-galaxy collection build --output-path /tmp/collection-build
