---
name: CI
on:
  push:
    branches: [main, stable-*]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.test }} (Ⓐ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.19, stable-2.20, stable-2.21, devel]
        test: [sanity, units]
    steps:
      - name: Run ansible-test
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: ${{ matrix.test }}
          # Run the complete suite, including release and scheduled runs.
          pull-request-change-detection: false

  integration:
    name: Integration (Ⓐ${{ matrix.ansible }})
    # Pin the x86 image: the VS needs KVM and 8 GiB RAM. Public repository
    # runners provide 4 CPUs and 16 GiB; arm64/slim runners cannot run this VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.19, stable-2.20, stable-2.21, devel]
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check VM prerequisites
        run: |
          test -c /dev/kvm
          available_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
          if (( available_kib < 12 * 1024 * 1024 )); then
            echo 'SONiC integration requires at least 12 GiB free disk space' >&2
            df -h
            exit 1
          fi
      - name: Build controller image
        env:
          ANSIBLE_CORE_REF: ${{ matrix.ansible }}
        run: |
          docker build --build-arg DOWNLOAD_SONIC_IMAGE=false \
            --build-arg "TESTBED_UID=$(id -u)" --build-arg "TESTBED_GID=$(id -g)" \
            --build-arg "ANSIBLE_CORE_REF=$ANSIBLE_CORE_REF" \
            -t community-sonic-testbed -f testbed/Dockerfile testbed
      - name: Download SONiC virtual disk
        env:
          SONIC_IMAGE_PATH: ${{ runner.temp }}/sonic-vs.img
        run: ./testbed/download-image.sh
      - name: Run virtual-switch integration tests
        run: |
          docker run --name sonic-integration --device /dev/kvm \
            --group-add "$(stat -c %g /dev/kvm)" \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            -v "$PWD:/work/ansible_collections/community/sonic" \
            -v "$RUNNER_TEMP/sonic-vs.img:/opt/sonic-vs.img:ro" \
            -w /work/ansible_collections/community/sonic \
            community-sonic-testbed -- /docker.sh
      - name: Collect VM log
        if: always()
        run: |
          mkdir -p tests/output/logs
          if docker container inspect sonic-integration >/dev/null 2>&1; then
            docker logs sonic-integration > tests/output/logs/container.log 2>&1
            docker cp sonic-integration:/tmp/qemu.log tests/output/logs/qemu.log || true
          fi
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-${{ matrix.ansible }}
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove VM container
        if: always()
        run: |
          if docker container inspect sonic-integration >/dev/null 2>&1; then
            docker rm --force sonic-integration
          fi

  # Keep the existing required status check stable for branch protection.
  check:
    if: always()
    needs: [tests, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all tests to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$TEST_RESULT" = success && test "$INTEGRATION_RESULT" = success
