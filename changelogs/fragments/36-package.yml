minor_changes:
  - package - new module that installs, upgrades, downgrades and uninstalls SONiC application extensions with ``sonic-package-manager`` from a registered repository, a registry reference or an image tarball (``source``), with ``state=present/absent/latest``, ``enabled``, ``owner``, ``allow_downgrade``, ``skip_host_plugins``, ``keep_config``, ``force``, ``custom_name`` and ``manifest``. Idempotency comes from the package database (``packages.json`` or ``sonic-package-manager list``), not from exit codes, and ``-y`` is always passed (https://github.com/ansible-collections/community.sonic/issues/36).
  - package_repository - new module that adds and removes ``sonic-package-manager`` repository entries (``repository add``/``repository remove``) idempotently, with check and diff mode (https://github.com/ansible-collections/community.sonic/issues/36).
